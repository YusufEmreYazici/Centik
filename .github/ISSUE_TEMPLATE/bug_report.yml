name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead. Screenshots or a recording help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Çentik version
      description: Settings → Hakkında
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: "macOS 15.1, MacBook Pro 14-inch M3"
    validations:
      required: true
  - type: dropdown
    id: notch
    attributes:
      label: Display
      options:
        - Built-in display with a notch
        - Display without a notch
        - External display
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Optional: output of `log stream --level debug --predicate 'subsystem == \"com.emre.centik\"'` while reproducing."
      render: text
